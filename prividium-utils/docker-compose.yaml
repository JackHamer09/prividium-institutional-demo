# Starts Besu (local EVM chain) and Prividium services.
# Run from repo root: docker compose -f ./prividium-utils/docker-compose.yaml up

name: besu-prividium

# ═══════════════════════════════════════════════════════════════
# Shared environment variables for setup/init containers
# ═══════════════════════════════════════════════════════════════
x-setup-env: &setup-env # Clique signer account (pre-funded in genesis)
  SIGNER_PRIVATE_KEY: "0xc87509a1c067bbde78beb793e6fa76530b6382a4c0241e5e4a9ec0a0f44dc0d3"
  SIGNER_ADDRESS: "0x627306090abaB3A6e1400e9345bC60c78a8BEf57"
  # Deployer (pre-funded in genesis)
  DEPLOYER_PRIVATE_KEY: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
  DEPLOYER_ADDRESS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
  # Demo User 1 (pre-funded in genesis)
  USER1_ADDRESS: "0xAD350E768913dAc29b8113C571fB3321c9d01495"
  # Demo User 2 (pre-funded in genesis)
  USER2_ADDRESS: "0xcFB389324aCf2e0Aad3aC5073166fe428f57fA89"
  # Contract Addresses (deterministic from deployer nonce)
  REPO_CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
  USDC_ADDRESS: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
  TUST_ADDRESS: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
  SGD_ADDRESS: "0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9"
  # Mint Amounts (USDC: 6 decimals → 10,000 USDC; TUST/SGD: 18 decimals → 100 tokens)
  USDC_MINT_AMOUNT: "10000000000"
  TUST_MINT_AMOUNT: "100000000000000000000"
  SGD_MINT_AMOUNT: "100000000000000000000"

services:
  # ═══════════════════════════════════════════════════════════════
  # CHAIN: Hyperledger Besu (Clique PoA, single signer)
  # ═══════════════════════════════════════════════════════════════
  besu:
    image: hyperledger/besu:24.12.2
    container_name: besu-chain
    ports:
      - 8545:8545
    volumes:
      - ./dev/besu/genesis.json:/config/genesis.json:ro
      - ./dev/besu/signer-key:/config/signer-key:ro
    command:
      - --genesis-file=/config/genesis.json
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-port=8545
      - --rpc-http-cors-origins=*
      - --rpc-http-api=ETH,NET,WEB3,DEBUG,ADMIN,TXPOOL
      - --host-allowlist=*
      - --p2p-enabled=false
      - --node-private-key-file=/config/signer-key
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'echo > /dev/tcp/localhost/8545' 2>/dev/null",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  # ═══════════════════════════════════════════════════════════════
  # DATABASE & AUTH
  # ═══════════════════════════════════════════════════════════════
  postgres:
    image: postgres:15
    restart: unless-stopped
    ports:
      - 5432:5432
    volumes:
      - postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    entrypoint: |
      bash -c "
      cat > /docker-entrypoint-initdb.d/init.sql << 'EOF'
      CREATE DATABASE prividium_api;
      CREATE DATABASE prividium_block_explorer;
      EOF

      exec docker-entrypoint.sh postgres
      "

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    ports:
      - 5080:8080
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_RELATIVE_PATH: /
      KC_HEALTH_ENABLED: "true"
      KC_METRICS_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HOSTNAME_URL: http://localhost:5080
      KC_HOSTNAME_ADMIN_URL: http://localhost:5080
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./dev/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000 && echo -e \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q 200'"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  # ═══════════════════════════════════════════════════════════════
  # PRIVIDIUM SERVICES
  # ═══════════════════════════════════════════════════════════════
  prividium-api:
    image: quay.io/matterlabs_enterprise/prividium-permissions-api:v1.163.1
    platform: linux/amd64
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      besu:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      PORT: 8000
      METRICS_PORT: 9091
      WALLETS_API_ENABLED: "true"
      AUTH_METHODS: oidc,crypto_native
      NODE_ENV: production
      SEQUENCER_RPC_URL: http://besu:8545
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/prividium_api
      CORS_ORIGIN: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003
      ADMIN_PANEL_REDIRECT_URLS: http://localhost:3000/callback
      BLOCK_EXPLORER_REDIRECT_URLS: http://localhost:3010/auth/callback
      SIWE_VALID_DOMAINS: localhost:3000,localhost:3001,localhost:3003
      SIWE_CHAIN_ID: 1337
      OIDC_JWKS_URI: http://keycloak:8080/realms/prividium/protocol/openid-connect/certs
      OIDC_JWT_AUD: prividium-client
      OIDC_JWT_ISSUER: http://localhost:5080/realms/prividium
      OIDC_ADMIN_SUBS: 00000000-0000-0000-0000-000000000001
      CORS_CACHE_DURATION_MS: 600000
      USER_SESSION_DURATION_SECONDS: 86400
      WEBAUTHN_RP_NAME: "Prividium Local"
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:3001
      WEBAUTHN_REQUIRE_USER_VERIFICATION: "false"
      EXTRA_PUBLIC_CODE_ADDRESSES: "0x36615cf349d7f6344891b1e7ca7c72883f5dc049"
    ports:
      - 8000:8000
      - 9091:9091

  admin-panel:
    image: quay.io/matterlabs_enterprise/prividium-adminv2:v1.163.1
    platform: linux/amd64
    container_name: prividium-admin-panel
    restart: unless-stopped
    environment:
      PORT: 3000
      VITE_PRIVIDIUM_API_URL: http://localhost:8000
      VITE_USER_PANEL_URL: http://localhost:3001
      VITE_EXPLORER_URL: http://localhost:3010
    depends_on:
      - prividium-api
      - user-panel
    ports:
      - 3000:3000

  user-panel:
    image: quay.io/matterlabs_enterprise/prividium-user-panel:v1.163.1
    platform: linux/amd64
    container_name: prividium-user-panel
    restart: unless-stopped
    environment:
      VITE_OIDC_AUTHORITY: http://localhost:5080/realms/prividium
      VITE_OIDC_CLIENT_ID: prividium-client
      VITE_OIDC_BUTTON_TEXT: Sign in with Keycloak
      VITE_AUTH_METHODS: oidc,crypto_native
      VITE_WALLETS_ENABLED: "true"
      PORT: 3000
      VITE_CHAIN_ID: 1337
      VITE_CHAIN_NAME: "Local Besu"
      VITE_OIDC_REDIRECT_URI: http://localhost:3001/callback
      VITE_OIDC_POST_LOGOUT_REDIRECT_URI: http://localhost:3001/login
      VITE_ADMIN_PANEL_REDIRECT_URI: http://localhost:3000/callback
      VITE_ADMIN_PANEL_URL: http://localhost:3000
      VITE_BLOCK_EXPLORER_REDIRECT_URI: http://localhost:3010/auth/callback
      VITE_PRIVIDIUM_API_URL: http://localhost:8000
      VITE_EXPLORER_URL: http://localhost:3010
      VITE_BRIDGING_ENABLED: "false"
      VITE_REOWN_PROJECT_ID: "a4160dbab1f9822e5798a1579d8c4ae7"
    depends_on:
      - prividium-api
    ports:
      - 3001:3000

  # ═══════════════════════════════════════════════════════════════
  # BLOCK EXPLORER
  # ═══════════════════════════════════════════════════════════════
  block-explorer-api:
    image: ghcr.io/matter-labs/block-explorer-api:latest
    platform: linux/amd64
    container_name: prividium-block-explorer-api
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      LOG_LEVEL: verbose
      NODE_ENV: development
      DATABASE_HOST: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: prividium_block_explorer
      DATABASE_ENABLE_SSL: "false"
      NETWORK_NAME: testnet
      PRIVIDIUM: "true"
      PRIVIDIUM_APP_URL: http://localhost:3010
      PRIVIDIUM_PERMISSIONS_API_URL: http://prividium-api:8000
      PRIVIDIUM_SESSION_SECRET: QkxPQ0tfRVhQTE9SRVJfU0VTU0lPTl9TRUNSRVQ=
      PRIVIDIUM_SESSION_MAX_AGE: 86400000
      PRIVIDIUM_SESSION_SAME_SITE: strict
      LIMITED_PAGINATION_MAX_ITEMS: "10000"
      API_LIMITED_PAGINATION_MAX_ITEMS: "1000"
      DISABLE_BFF_API_SCHEMA_DOCS: "true"
    depends_on:
      postgres:
        condition: service_healthy
      besu:
        condition: service_healthy
    ports:
      - 3002:3000

  block-explorer-app:
    image: ghcr.io/matter-labs/block-explorer-app:latest
    platform: linux/amd64
    container_name: prividium-block-explorer-app
    environment:
      PORT: 3010
      VITE_APP_ENVIRONMENT: prividium
    depends_on:
      - block-explorer-api
    ports:
      - 3010:3010
    volumes:
      - ./dev/block-explorer/block-explorer-config.js:/usr/share/nginx/html/config.js:ro

  block-explorer-worker:
    image: ghcr.io/matter-labs/block-explorer-worker:latest
    platform: linux/amd64
    container_name: prividium-block-explorer-worker
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      DATABASE_HOST: postgres
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_NAME: prividium_block_explorer
      DATABASE_ENABLE_SSL: "false"
      BLOCKCHAIN_RPC_URL: http://besu:8545
      DATA_FETCHER_URL: http://block-explorer-data-fetcher:3040
      NETWORK_NAME: testnet
      PRIVIDIUM: "true"
      PRIVIDIUM_PERMISSIONS_API_URL: http://prividium-api:8000/api
      ENABLE_TOKEN_OFFCHAIN_DATA_SAVER: "true"
      BLOCKS_PROCESSING_BATCH_SIZE: "10"
      NUMBER_OF_BLOCKS_PER_DB_TRANSACTION: "10"
    depends_on:
      postgres:
        condition: service_healthy
      block-explorer-data-fetcher:
        condition: service_started
      besu:
        condition: service_healthy

  block-explorer-data-fetcher:
    image: ghcr.io/matter-labs/block-explorer-data-fetcher:latest
    platform: linux/amd64
    container_name: prividium-block-explorer-data-fetcher
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      besu:
        condition: service_healthy
    environment:
      NETWORK_NAME: testnet
      BLOCKCHAIN_RPC_URL: http://besu:8545
      PRIVIDIUM: "true"
      PRIVIDIUM_PERMISSIONS_API_URL: http://prividium-api:8000/api
    ports:
      - 3040:3040

  # ═══════════════════════════════════════════════════════════════
  # SETUP: One-shot init containers (run in order, then exit)
  # ═══════════════════════════════════════════════════════════════
  contracts-deploy:
    image: ghcr.io/jackhamer09/prividium-setup-tools:single-chain
    build:
      context: ..
      dockerfile: docker/setup-tools.Dockerfile
    platform: linux/amd64
    working_dir: /workspace/contracts
    environment:
      <<: *setup-env
    command: >-
      bash -c "
      export PRIVATE_KEY=$$DEPLOYER_PRIVATE_KEY &&
      export ADMIN_ADDRESS=$$DEPLOYER_ADDRESS &&
      export DEPLOY_TEST_TOKENS=true &&
      cp -n .env.example .env 2>/dev/null || true &&
      echo 'Deploying contracts...' &&
      forge script script/Deploy.s.sol:DeployScript --rpc-url http://besu:8545 --broadcast
      "
    depends_on:
      besu:
        condition: service_healthy
    restart: "no"

  mint-tokens:
    image: ghcr.io/jackhamer09/prividium-setup-tools:single-chain
    build:
      context: ..
      dockerfile: docker/setup-tools.Dockerfile
    platform: linux/amd64
    environment:
      <<: *setup-env
    command: >-
      bash -c "
      set -e &&
      echo 'Minting tokens for user1...' &&
      ./scripts/mint.sh $$USER1_ADDRESS $$USDC_ADDRESS $$USDC_MINT_AMOUNT $$DEPLOYER_PRIVATE_KEY http://besu:8545 &&
      ./scripts/mint.sh $$USER1_ADDRESS $$TUST_ADDRESS $$TUST_MINT_AMOUNT $$DEPLOYER_PRIVATE_KEY http://besu:8545 &&
      ./scripts/mint.sh $$USER1_ADDRESS $$SGD_ADDRESS $$SGD_MINT_AMOUNT $$DEPLOYER_PRIVATE_KEY http://besu:8545 &&
      echo 'Minting tokens for user2...' &&
      ./scripts/mint.sh $$USER2_ADDRESS $$USDC_ADDRESS $$USDC_MINT_AMOUNT $$DEPLOYER_PRIVATE_KEY http://besu:8545 &&
      ./scripts/mint.sh $$USER2_ADDRESS $$TUST_ADDRESS $$TUST_MINT_AMOUNT $$DEPLOYER_PRIVATE_KEY http://besu:8545 &&
      ./scripts/mint.sh $$USER2_ADDRESS $$SGD_ADDRESS $$SGD_MINT_AMOUNT $$DEPLOYER_PRIVATE_KEY http://besu:8545
      "
    depends_on:
      contracts-deploy:
        condition: service_completed_successfully
    restart: "no"

  prividium-seed:
    image: ghcr.io/jackhamer09/prividium-setup-tools:single-chain
    build:
      context: ..
      dockerfile: docker/setup-tools.Dockerfile
    platform: linux/amd64
    command: >-
      bash -c "
      echo 'Waiting for permissions API migrations to complete...' &&
      until PGPASSWORD=postgres psql -h postgres -U postgres -d prividium_api -c 'SELECT 1 FROM users LIMIT 1' > /dev/null 2>&1; do
        echo 'Waiting for prividium_api tables...'; sleep 3;
      done &&
      echo 'Tables ready, seeding...' &&
      PGPASSWORD=postgres psql -h postgres -U postgres -d prividium_api < /workspace/prividium-utils/dev/seed-permissions.sql
      "
    depends_on:
      prividium-api:
        condition: service_started
      mint-tokens:
        condition: service_completed_successfully
    restart: "no"

  # ═══════════════════════════════════════════════════════════════
  # APP: Demo frontend (production build)
  # ═══════════════════════════════════════════════════════════════
  demo-app:
    image: ghcr.io/jackhamer09/prividium-demo-app:single-chain
    build:
      context: ..
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - 3003:3003
    environment:
      NUXT_PUBLIC_INTRADAY_REPO_CONTRACT_ADDRESS: "0x5FbDB2315678afecb367f032d93F642f64180aa3"
      NUXT_PUBLIC_USDC_ADDRESS: "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
      NUXT_PUBLIC_TUST_ADDRESS: "0x9fE46736679d2D9a65F0992F2272dE9f3c7fa6e0"
      NUXT_PUBLIC_SGD_ADDRESS: "0xCf7Ed3AccA5a467e9e704C703E8D87F634fB0Fc9"
      NUXT_PUBLIC_PRIVIDIUM_CLIENT_ID: IjRacE3lJ8vF85jJ
      NUXT_PUBLIC_PRIVIDIUM_RPC_URL: http://localhost:8000/rpc
      NUXT_PUBLIC_PRIVIDIUM_AUTH_BASE_URL: http://localhost:3001
      NUXT_PUBLIC_PRIVIDIUM_PERMISSIONS_API_BASE_URL: http://localhost:8000
      NUXT_PUBLIC_PRIVIDIUM_CHAIN_ID: 1337
      NUXT_PUBLIC_PRIVIDIUM_CHAIN_NAME: Local Besu
      NUXT_PUBLIC_PRIVIDIUM_BLOCK_EXPLORER_URL: http://localhost:3010
      NUXT_PUBLIC_PRIVIDIUM_BLOCK_EXPLORER_NAME: Block Explorer
    depends_on:
      mint-tokens:
        condition: service_completed_successfully
      prividium-seed:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres:

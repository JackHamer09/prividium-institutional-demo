[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
optimizer = true
optimizer_runs = 200
via_ir = true
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-v4/=lib/era-contracts/lib/openzeppelin-contracts-v4/contracts/",
    "era-contracts/=lib/era-contracts/",
]

[rpc_endpoints]
sepolia = "${RPC_URL}"

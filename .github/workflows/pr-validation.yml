name: PR Validation

on:
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: demo-app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Build SDK
        working-directory: sdk
        run: npm ci && npm run build

      - name: Run lint
        run: pnpm lint

      - name: Run typecheck
        run: pnpm typecheck

  contracts:
    name: Contract Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Install dependencies
        run: forge soldeer install

      - name: Build contracts
        run: forge build

      - name: Run tests
        run: forge test
